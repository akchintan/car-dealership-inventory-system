services:
  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
    depends_on:
      - mongodb
    environment:
      PORT: 5000
      JWT_SECRET: replace_me
      MONGO_URI: mongodb://mongodb:27017/car_dealership_inventory
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongodb_data:
