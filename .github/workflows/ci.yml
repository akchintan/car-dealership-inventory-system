name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend quality checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend quality checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Detect backend scripts
        id: scripts
        run: |
          echo "build=$(node -p \"Boolean(require('./package.json').scripts?.build)\")" >> "$GITHUB_OUTPUT"
          echo "test=$(node -p \"Boolean(require('./package.json').scripts?.test)\")" >> "$GITHUB_OUTPUT"

      - name: Build backend
        if: steps.scripts.outputs.build == 'true'
        run: npm run build

      - name: Test backend
        if: steps.scripts.outputs.test == 'true'
        run: npm run test
